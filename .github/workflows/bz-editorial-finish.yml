name: BZ-Age editorial finishing check
on:
  push:
    branches: [claude/zealous-goldberg-6vhirf]
    paths: [BZ-Age/tools/finish_editorial_20261116.py]
permissions:
  contents: write
concurrency:
  group: bz-age-editorial-20261116
  cancel-in-progress: false
jobs:
  finish:
    if: github.repository == 'Jwood1126-coder/BZ-Age'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply version-checked finishing edits and rebuild
        run: |
          python3 -m py_compile BZ-Age/tools/finish_editorial_20261116.py
          python3 BZ-Age/tools/finish_editorial_20261116.py
          python3 BZ-Age/tools/assemble_draft07.py
          python3 BZ-Age/tools/finish_editorial_20261116.py --verify
          git diff --check
      - name: Commit validated narration and records
        env:
          TARGET_BRANCH: claude/zealous-goldberg-6vhirf
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA" || { echo 'Branch moved; refusing to overwrite newer work.'; exit 1; }
          git add BZ-Age/02-Parts BZ-Age/BZ-Age-draft07-audiobook.md BZ-Age/BZ-Age-draft07-visual-cues.md BZ-Age/tools/assemble_draft07.py BZ-Age/04-Working-Notes/draft-07-v0.7.4-applied.md
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Draft-07 v0.7.4: finish documentary and narrative continuity corrections [skip ci]'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD
